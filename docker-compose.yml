# ==============================================================================
# Entorno Docker Autónomo para jg_filmmaker (Pipeline Cinematográfico IA)
# ==============================================================================
services:
  jg_filmmaker:
    build:
      context: .
      dockerfile: Dockerfile
    image: jg_filmmaker:latest
    container_name: jg_filmmaker
    restart: unless-stopped
    environment:
      APP_NAME: "jG Filmmaker"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: "${APP_KEY:-base64:fH7i9N2bV5kM8qR3tY6wP1sL4xJ7aB0cDeFgHiJkLmN=}"
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8010}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      RUN_MIGRATIONS: "true"
      SEED_DEMO: "true"
      JG_AGENTE_MOCK: "${JG_AGENTE_MOCK:-false}"
      JG_AGENTE_URL: "${JG_AGENTE_URL:-http://127.0.0.1:8001}"
      JG_AGENTE_SECRET: "${JG_AGENTE_SECRET:-test-secret-ecosystem-2026}"
      LLM_PROVIDER: "${LLM_PROVIDER:-groq}"
      LLM_MODEL: "${LLM_MODEL:-llama-3.3-70b-versatile}"
    env_file:
      - .env
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./.env:/var/www/html/.env:ro
      - jg_filmmaker_storage:/var/www/html/storage
      - jg_filmmaker_database:/var/www/html/database
    ports:
      - "${FILMMAKER_PORT:-8010}:8080"
    networks:
      - jg_network

networks:
  jg_network:
    name: jg_network
    external: true

volumes:
  jg_filmmaker_storage:
  jg_filmmaker_database:
