user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Permitir subidas de vídeo de tomas de hasta 120MB (coherente con PHP y Livewire)
    client_max_body_size 120M;
    client_body_buffer_size 1M;
    client_body_temp_path /var/lib/nginx/tmp/client_body;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_forwarded_proto $fastcgi_https {
        default '';
        https on;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /var/www/html/public;

        index index.php index.html;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        # Denegar taxativamente la ejecución de scripts bajo /storage/ y mitigar MIME-sniffing
        location ^~ /storage/ {
            location ~ \.php$ {
                deny all;
            }
            add_header X-Content-Type-Options nosniff;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
            fastcgi_param HTTP_X_FORWARDED_FOR   $http_x_forwarded_for if_not_empty;
            fastcgi_param HTTP_X_REAL_IP        $http_x_real_ip if_not_empty;
            fastcgi_param HTTP_X_FORWARDED_HOST  $http_x_forwarded_host if_not_empty;
            fastcgi_param HTTP_X_FORWARDED_PORT  $http_x_forwarded_port if_not_empty;
            fastcgi_param HTTPS                  $fastcgi_https if_not_empty;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 300;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
