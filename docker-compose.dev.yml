# ==============================================================================
# Entorno de Desarrollo Local con Recarga en Caliente para jg_filmmaker
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# ==============================================================================
services:
  jg_filmmaker:
    build:
      context: .
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "api.groq.com:172.64.149.20"
      - "generativelanguage.googleapis.com:172.217.119.4"
      - "es.wikipedia.org:185.15.58.224"
      - "en.wikipedia.org:185.15.58.224"
    volumes:
      - ./app:/var/www/html/app
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php:ro
      - ./config:/var/www/html/config
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./database/migrations:/var/www/html/database/migrations
      - ./docker/supervisord.conf:/etc/supervisord.conf:ro
      - ${TV_MEDIA_HOST_PATH:-/Users/javiergalvez/Library/CloudStorage/GoogleDrive-javiergalvezmovil@gmail.com/Mi unidad/Code/javiergalvez-ia/tv}:/var/www/html/storage/tv_media
      - ./.env:/var/www/html/.env:ro
